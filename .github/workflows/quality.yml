name: Quality and production deploy

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  quality:
    name: build-and-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 2
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.61.1
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright install-deps chromium
      - run: ./scripts/validate.sh
      - run: npm run test:unit
      - run: npm run test:browser
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: deploy-production
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Check Vercel configuration
        run: |
          [[ -n "$VERCEL_TOKEN" ]] || { echo 'Missing VERCEL_TOKEN'; exit 1; }
          [[ -n "$VERCEL_ORG_ID" ]] || { echo 'Missing VERCEL_ORG_ID'; exit 1; }
          [[ -n "$VERCEL_PROJECT_ID" ]] || { echo 'Missing VERCEL_PROJECT_ID'; exit 1; }
      - run: npx --yes vercel@59.1.3 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production artifact
        env:
          HUGO_VERSION: '0.154.5'
        run: npx --yes vercel@59.1.3 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production
        id: deploy
        run: |
          url=$(npx --yes vercel@59.1.3 deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify production
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          expected_paths=()
          if [[ "${{ github.event_name }}" == "push" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            while IFS= read -r file; do
              slug=$(basename "$(dirname "$file")")
              expected_paths+=("/posts/$slug/")
            done < <(git diff --name-only --diff-filter=AMR "$BEFORE_SHA" "$GITHUB_SHA" -- 'content/posts/*/index.md')
          fi
          for attempt in {1..6}; do
            if ./scripts/smoke-test.sh "https://code-learn-build-evolve.vercel.app" "${expected_paths[@]}"; then
              exit 0
            fi
            echo "Production smoke retry $attempt/6"
            sleep 10
          done
          exit 1
