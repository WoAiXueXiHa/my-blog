name: Site maintenance

on:
  schedule:
    - cron: '20 2 * * *'
    - cron: '40 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: SMOKE_SCOPE=all ./scripts/smoke-test.sh

  dependency-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '40 2 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
